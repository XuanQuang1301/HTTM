<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Audio Wave Gradient -->
    <linearGradient id="waveGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    
    <!-- Red Alert Pulse Gradient -->
    <linearGradient id="alertGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Outer Glow Shield -->
  <path d="M256 32 C340 32, 432 64, 432 64 L432 240 C432 360, 320 448, 256 480 C192 448, 80 360, 80 240 L80 64 C80 64, 172 32, 256 32 Z" 
        fill="url(#shieldBg)" 
        stroke="url(#borderGlow)" 
        stroke-width="16" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Inner Security Grid / Tech Rings -->
  <circle cx="256" cy="230" r="100" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="8 8"/>
  <circle cx="256" cy="230" r="140" fill="none" stroke="#1e293b" stroke-width="6"/>

  <!-- AI Sound Wave Columns (Audio Security Pulse) -->
  <g fill="url(#waveGlow)" opacity="0.95">
    <rect x="176" y="200" width="16" height="60" rx="8"/>
    <rect x="208" y="160" width="16" height="140" rx="8"/>
    <rect x="240" y="120" width="16" height="220" rx="8"/>
    <rect x="272" y="150" width="16" height="160" rx="8"/>
    <rect x="304" y="180" width="16" height="100" rx="8"/>
    <rect x="336" y="210" width="16" height="40" rx="8"/>
  </g>

  <!-- Glowing Radar Ping / Lock Center -->
  <circle cx="256" cy="230" r="18" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="256" cy="230" r="8" fill="#ffffff"/>

  <!-- AI Pulse Lock Arc -->
  <path d="M 180 230 A 76 76 0 0 1 332 230" fill="none" stroke="url(#borderGlow)" stroke-width="10" stroke-linecap="round"/>
  <path d="M 200 230 A 56 56 0 0 0 312 230" fill="none" stroke="url(#alertGlow)" stroke-width="6" stroke-linecap="round"/>
</svg>